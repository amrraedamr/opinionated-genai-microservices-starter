[local]

# ── Webserver ────────────────────────────────────────────────────────────────
max_gunicorn_workers = 2

# ── Auth - JWT with RSA256 ───────────────────────────────────────────────────
auth_private_key_path = keys/private.pem
auth_public_key_path = keys/public.pem
access_token_expiry_seconds = 900
refresh_token_expiry_seconds = 604800

# ── SQLite ───────────────────────────────────────────────────────────────────
sqlite_db_path = database/poc-skeleton.db

# ── Shared SQL Pool Settings (MySQL / PostgreSQL) ────────────────────────────
# TODO: set these if using MySQL or PostgreSQL
db_pool_size =
db_max_overflow =
db_pool_timeout =
db_pool_recycle =
db_ssl_enabled =

# ── PostgreSQL ───────────────────────────────────────────────────────────────
# TODO: set these if using PostgreSQL
pg_username =
pg_password =
pg_host =
pg_port =
pg_database =
pg_ssl_root_cert =

# ── MySQL ────────────────────────────────────────────────────────────────────
# TODO: set these if using MySQL
mysql_username =
mysql_password =
mysql_host =
mysql_database =

# ── Redis ────────────────────────────────────────────────────────────────────
# TODO: set redis_url (e.g. rediss://:<password>@<host>:<port>/0)
redis_url =
# TODO: set these if customizing Redis connection behavior
redis_ssl_cert_reqs =
redis_max_connections =
redis_socket_timeout =
redis_socket_connect_timeout =
redis_retry_on_timeout =
redis_health_check_interval =
redis_decode_responses =

# ── MongoDB ──────────────────────────────────────────────────────────────────
# TODO: set these if using MongoDB
mongodb_base_path =
mongodb_username =
mongodb_password =
mongodb_host =
mongodb_database =
mongodb_params =
mongodb_min_pool_size =
mongodb_max_pool_size =
mongodb_connect_timeout_ms =
mongodb_socket_timeout_ms =
mongodb_server_selection_timeout_ms =

# ── Azure Blob Storage ──────────────────────────────────────────────────────
# TODO: set this if using Azure Blob Storage
azure_blob_account_url =

# ── Azure Key Vault ─────────────────────────────────────────────────────────
# TODO: set keyvault_url if using Azure Key Vault (e.g. https://<vault-name>.vault.azure.net/)
keyvault_url =
# These must match the tags in config.keyvault.ini for secret name formatting
system_keyvault_tag = appconfig
model_keyvault_tag = modelconfig

# ── Azure OpenAI Embeddings ─────────────────────────────────────────────────
# TODO: set these if using Azure OpenAI for embeddings
azure_openai_embedding_api_key =
azure_openai_api_version =
azure_openai_embedding_api_base =
