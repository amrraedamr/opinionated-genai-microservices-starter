[uat]

# Webserver
max_gunicorn_workers = 2

# Auth - JWT with RSA256
auth_private_key_path = ENV:AUTH_PRIVATE_KEY_PATH
auth_public_key_path = ENV:AUTH_PUBLIC_KEY_PATH
access_token_expiry_seconds = 900
refresh_token_expiry_seconds = 604800

# SQL Backend (sqlite | mysql | postgresql)
sql_backend = sqlite

# SQLite
sqlite_db_path = ENV:SQLITE_DB_PATH

# Shared SQL Pool Settings (MySQL / PostgreSQL)
db_pool_size =
db_max_overflow =
db_pool_timeout =
db_pool_recycle =
db_ssl_enabled =

# PostgreSQL
pg_host =
pg_port =
pg_database =
pg_ssl_root_cert =
pg_username = ENV:POSTGRES_USER
pg_password = ENV:POSTGRES_PASSWORD

# MySQL
mysql_host =
mysql_database =
mysql_username = ENV:MYSQL_USER
mysql_password = ENV:MYSQL_PASSWORD

# Redis
redis_url = ENV:REDIS_URL
redis_ssl_cert_reqs =
redis_max_connections =
redis_socket_timeout =
redis_socket_connect_timeout =
redis_retry_on_timeout =
redis_health_check_interval =
redis_decode_responses =

# Cosmos DB
azure_cosmos_account_uri = ENV:AZURE_COSMOS_ACCOUNT_URI
azure_cosmos_account_key = ENV:AZURE_COSMOS_ACCOUNT_KEY
azure_cosmos_database_name =

# MongoDB
mongodb_username = ENV:MONGODB_USER
mongodb_password = ENV:MONGODB_PASSWORD
mongodb_base_path =
mongodb_host =
mongodb_database =
mongodb_params =
mongodb_min_pool_size =
mongodb_max_pool_size =
mongodb_connect_timeout_ms =
mongodb_socket_timeout_ms =
mongodb_server_selection_timeout_ms =

# Azure Blob Storage
