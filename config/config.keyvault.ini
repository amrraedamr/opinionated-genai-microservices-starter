[keyvault]

# Azure Key Vault Secret Tag Prefixes
# These tags are used to prefix secret names in Azure Key Vault.
# The KeyvaultConfigLoader fetches all secrets with the system_keyvault_tag
# prefix and stores them in memory for access via KeyvaultConfig.get().
#
# Secrets in Key Vault should be named like: <tag>-<key-name>
# Example: appconfig-database-host → accessed as KeyvaultConfig.get("database_host")
#
# TODO: set these to match your Azure Key Vault secret naming convention
model_keyvault_tag = modelconfig
system_keyvault_tag = appconfig
